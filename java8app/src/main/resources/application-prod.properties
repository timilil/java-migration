# Spring Boot Application Properties - Production Profile

spring.application.name=java8-spring-app

# Server Configuration
server.port=8080

# Database Configuration - PostgreSQL (Production)
spring.datasource.url=jdbc:postgresql://localhost:5432/java8app_prod
spring.datasource.username=prod_user
spring.datasource.password=prod_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQL10Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Liquibase Configuration
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.contexts=prod

# Connection Pool Configuration - C3P0
spring.datasource.c3p0.max-pool-size=30
spring.datasource.c3p0.min-pool-size=10
spring.datasource.c3p0.checkout-timeout=30000
spring.datasource.c3p0.max-idle-time=600

# Logging Configuration
logging.level.root=WARN
logging.level.com.example=INFO
logging.file.name=/var/log/java8app/application.log
logging.file.max-size=10MB
logging.file.max-history=30

# OpenAPI/Swagger Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true