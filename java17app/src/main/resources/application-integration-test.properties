# Spring Boot Application Properties - Integration Test Profile

spring.application.name=java8-spring-app

# Server Configuration
server.port=8082

# Database Configuration - H2 (in-memory)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Liquibase Configuration
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.contexts=integration-test

# Connection Pool Configuration - C3P0
spring.datasource.c3p0.max-pool-size=5
spring.datasource.c3p0.min-pool-size=2
spring.datasource.c3p0.checkout-timeout=30000

# Logging Configuration
logging.level.root=WARN
logging.level.com.example=DEBUG
logging.level.org.springframework.test=DEBUG

# OpenAPI/Swagger Configuration
springdoc.swagger-ui.enabled=false
