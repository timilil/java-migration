# Default application properties - will be overridden by profile-specific files
spring.application.name=java8-spring-app

# Set default profile to dev (can be overridden with Maven -P flag or spring.profiles.active)
spring.profiles.default=dev

# JPA Configuration
spring.jpa.open-in-view=false

# JSON Configuration
spring.jackson.serialization.indent_output=true
spring.jackson.serialization.write_dates_as_timestamps=false
spring.jackson.time-zone=UTC

# Banner
spring.banner.location=classpath:banner.txt
