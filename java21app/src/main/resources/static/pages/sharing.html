<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sharing - Document Management</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { background: white; padding: 25px; border-radius: 10px; margin-bottom: 30px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .header a { display: inline-block; margin-bottom: 15px; color: #667eea; text-decoration: none; font-weight: 600; }
        .header a:hover { text-decoration: underline; }
        .header h1 { color: #333; margin-bottom: 5px; font-size: 32px; }
        .header p { color: #666; font-size: 14px; }
        .tabs { display: flex; gap: 10px; margin-top: 20px; border-bottom: 2px solid #e0e0e0; flex-wrap: wrap; }
        .tab-btn { padding: 12px 20px; background: transparent; border: none; border-bottom: 3px solid transparent; cursor: pointer; font-weight: 600; color: #999; transition: all 0.3s; font-size: 13px; }
        .tab-btn.active { color: #667eea; border-bottom-color: #667eea; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .form-card { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; color: #333; font-size: 14px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; font-family: inherit; font-size: 14px; }
        input:focus, select:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1); }
        button { padding: 10px 15px; background: #667eea; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: 600; font-size: 14px; transition: background 0.3s; }
        button:hover { background: #5568d3; }
        button.secondary { background: #e0e0e0; color: #333; }
        button.secondary:hover { background: #d0d0d0; }
        .result-box { background: #f5f5f5; padding: 15px; border-radius: 5px; margin-top: 15px; border-left: 4px solid #667eea; font-size: 13px; overflow-y: auto; font-family: 'Courier New', monospace; white-space: pre-wrap; word-break: break-word; max-height: 400px; }
        .result-box.error { background: #ffebee; border-left-color: #f44336; color: #c62828; }
        .result-box.success { background: #e8f5e9; border-left-color: #4caf50; color: #2e7d32; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="/">← Back to Home</a>
            <h1>Document Sharing</h1>
            <p>Share documents, revoke access, view and manage shares</p>
            
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab(event, 'share')">Share Document</button>
                <button class="tab-btn" onclick="switchTab(event, 'view')">View Shares</button>
                <button class="tab-btn" onclick="switchTab(event, 'access')">Check Access</button>
                <button class="tab-btn" onclick="switchTab(event, 'revoke')">Revoke Share</button>
                <button class="tab-btn" onclick="switchTab(event, 'shared')">Shared with Me</button>
            </div>
        </div>

        <!-- Share Tab -->
        <div id="share" class="tab-content active">
            <div class="form-card">
                <h3>Share a Document</h3>
                <div class="form-group">
                    <label>Document ID</label>
                    <input type="number" id="shareDocId" placeholder="1" value="1">
                </div>
                <div class="form-group">
                    <label>Owner ID (your ID)</label>
                    <input type="number" id="shareOwnerId" placeholder="1" value="1">
                </div>
                <div class="form-group">
                    <label>Share with User ID</label>
                    <input type="number" id="shareWithUserId" placeholder="2" value="2">
                </div>
                <div class="form-group">
                    <label>Permission Type</label>
                    <select id="sharePermission">
                        <option value="VIEW">VIEW</option>
                        <option value="EDIT">EDIT</option>
                        <option value="SHARE">SHARE</option>
                    </select>
                </div>
                <button onclick="shareDocument()">Share Document</button>
                <div class="result-box" id="shareResult"></div>
            </div>
        </div>

        <!-- View Shares Tab -->
        <div id="view" class="tab-content">
            <div class="form-card">
                <h3>View Document Shares</h3>
                <div class="form-group">
                    <label>Document ID</label>
                    <input type="number" id="viewDocId" placeholder="1" value="1">
                </div>
                <button class="secondary" onclick="viewShares()">View Shares</button>
                <div class="result-box" id="viewResult"></div>
            </div>
        </div>

        <!-- Check Access Tab -->
        <div id="access" class="tab-content">
            <div class="form-card">
                <h3>Check Access Permission</h3>
                <div class="form-group">
                    <label>Document ID</label>
                    <input type="number" id="checkDocId" placeholder="1" value="1">
                </div>
                <div class="form-group">
                    <label>User ID</label>
                    <input type="number" id="checkUserId" placeholder="2" value="2">
                </div>
                <button onclick="checkAccess()">Check Access</button>
                <div class="result-box" id="checkResult"></div>
            </div>
        </div>

        <!-- Revoke Share Tab -->
        <div id="revoke" class="tab-content">
            <div class="form-card">
                <h3>Revoke Document Share</h3>
                <div class="form-group">
                    <label>Document ID</label>
                    <input type="number" id="revokeDocId" placeholder="1" value="1">
                </div>
                <div class="form-group">
                    <label>Share ID</label>
                    <input type="number" id="revokeShareId" placeholder="1" value="1">
                </div>
                <div class="form-group">
                    <label>Owner ID</label>
                    <input type="number" id="revokeOwnerId" placeholder="1" value="1">
                </div>
                <button class="secondary" onclick="revokeShare()" style="background: #f44336;">Revoke Share</button>
                <div class="result-box" id="revokeResult"></div>
            </div>
        </div>

        <!-- Shared with Me Tab -->
        <div id="shared" class="tab-content">
            <div class="form-card">
                <h3>Documents Shared With Me</h3>
                <div class="form-group">
                    <label>Your User ID</label>
                    <input type="number" id="sharedUserId" placeholder="2" value="2">
                </div>
                <button class="secondary" onclick="getSharedWithMe()">Load Shared Documents</button>
                <div class="result-box" id="sharedResult"></div>
            </div>
        </div>
    </div>

    <script>
        function switchTab(e, tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            e.target.classList.add('active');
        }

        async function apiCall(method, endpoint, data = null) {
            try {
                const options = { method, headers: { 'Content-Type': 'application/json' } };
                if (data) options.body = JSON.stringify(data);
                const response = await fetch('/api' + endpoint, options);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return await response.json().catch(() => response.text());
            } catch (e) {
                throw e;
            }
        }

        function showResult(elementId, data, isError = false) {
            const el = document.getElementById(elementId);
            if (el) {
                el.className = 'result-box' + (isError ? ' error' : ' success');
                el.textContent = typeof data === 'string' ? data : JSON.stringify(data, null, 2);
            }
        }

        async function shareDocument() {
            try {
                const docId = document.getElementById('shareDocId').value;
                const data = {
                    docId: docId,
                    ownerId: document.getElementById('shareOwnerId').value,
                    sharedWithUserId: document.getElementById('shareWithUserId').value,
                    permissionType: document.getElementById('sharePermission').value
                };
                const result = await apiCall('POST', `/documents/${docId}/share`, data);
                showResult('shareResult', result);
            } catch (e) {
                showResult('shareResult', `Error: ${e.message}`, true);
            }
        }

        async function viewShares() {
            try {
                const docId = document.getElementById('viewDocId').value || '1';
                const result = await apiCall('GET', `/documents/${docId}/shares`);
                showResult('viewResult', result || []);
            } catch (e) {
                showResult('viewResult', `Error: ${e.message}`, true);
            }
        }

        async function checkAccess() {
            try {
                const docId = document.getElementById('checkDocId').value || '1';
                const userId = document.getElementById('checkUserId').value || '2';
                const result = await apiCall('GET', `/documents/${docId}/access?userId=${userId}`);
                showResult('checkResult', `Access: ${result}`);
            } catch (e) {
                showResult('checkResult', `Error: ${e.message}`, true);
            }
        }

        async function revokeShare() {
            try {
                const docId = document.getElementById('revokeDocId').value;
                const shareId = document.getElementById('revokeShareId').value;
                const ownerId = document.getElementById('revokeOwnerId').value;
                if (!confirm(`Revoke share ${shareId} for document ${docId}?`)) return;
                const result = await apiCall('DELETE', `/documents/${docId}/share/${shareId}?ownerId=${ownerId}`);
                showResult('revokeResult', 'Share revoked successfully');
            } catch (e) {
                showResult('revokeResult', `Error: ${e.message}`, true);
            }
        }

        async function getSharedWithMe() {
            try {
                const userId = document.getElementById('sharedUserId').value || '2';
                const result = await apiCall('GET', `/documents/shared-with/${userId}`);
                showResult('sharedResult', result || []);
            } catch (e) {
                showResult('sharedResult', `Error: ${e.message}`, true);
            }
        }
    </script>
</body>
</html>
