<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users - Document Management</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .header {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .header a {
            display: inline-block;
            margin-bottom: 15px;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        .header a:hover { text-decoration: underline; }
        .header h1 { color: #333; margin-bottom: 5px; font-size: 32px; }
        .header p { color: #666; font-size: 14px; }
        .tabs {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            border-bottom: 2px solid #e0e0e0;
        }
        .tab-btn {
            padding: 12px 20px;
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            font-weight: 600;
            color: #999;
            transition: all 0.3s;
        }
        .tab-btn.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }
        .tab-btn:hover { color: #667eea; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .form-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-family: inherit;
            font-size: 14px;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        button {
            flex: 1;
            min-width: 120px;
            padding: 10px 15px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: background 0.3s;
        }
        button:hover { background: #5568d3; }
        button.secondary {
            background: #e0e0e0;
            color: #333;
        }
        button.secondary:hover { background: #d0d0d0; }
        .result-box {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 5px;
            margin-top: 15px;
            border-left: 4px solid #667eea;
            font-size: 13px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 400px;
        }
        .result-box.error { background: #ffebee; border-left-color: #f44336; color: #c62828; }
        .result-box.success { background: #e8f5e9; border-left-color: #4caf50; color: #2e7d32; }
        .list-item {
            background: white;
            padding: 12px;
            margin-bottom: 8px;
            border-left: 3px solid #667eea;
            border-radius: 3px;
            font-size: 13px;
        }
        @media (max-width: 600px) {
            .button-group { flex-direction: column; }
            button { min-width: auto; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="/">← Back to Home</a>
            <h1>Users</h1>
            <p>Create, read, update, and delete users</p>
            
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab(event, 'list')">List Users</button>
                <button class="tab-btn" onclick="switchTab(event, 'create')">Create User</button>
                <button class="tab-btn" onclick="switchTab(event, 'get')">Get User by ID</button>
                <button class="tab-btn" onclick="switchTab(event, 'update')">Update User</button>
                <button class="tab-btn" onclick="switchTab(event, 'delete')">Delete User</button>
            </div>
        </div>

        <!-- List Tab -->
        <div id="list" class="tab-content active">
            <div class="form-card">
                <h3>All Users</h3>
                <button class="secondary" onclick="listAllUsers()">Load Users</button>
                <div class="result-box" id="listResult"></div>
            </div>
        </div>

        <!-- Create Tab -->
        <div id="create" class="tab-content">
            <div class="form-card">
                <h3>Create New User</h3>
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="createUsername" placeholder="john_doe">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="createEmail" placeholder="john@example.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="createPassword" placeholder="••••••••">
                </div>
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="createFullName" placeholder="John Doe">
                </div>
                <button onclick="createUser()">Create User</button>
                <div class="result-box" id="createResult"></div>
            </div>
        </div>

        <!-- Get by ID Tab -->
        <div id="get" class="tab-content">
            <div class="form-card">
                <h3>Get User by ID</h3>
                <div class="form-group">
                    <label>User ID</label>
                    <input type="number" id="getUserId" placeholder="1" value="1">
                </div>
                <button onclick="getUser()">Get User</button>
                <div class="result-box" id="getResult"></div>
            </div>
        </div>

        <!-- Update Tab -->
        <div id="update" class="tab-content">
            <div class="form-card">
                <h3>Update User</h3>
                <div class="form-group">
                    <label>User ID</label>
                    <input type="number" id="updateUserId" placeholder="1" value="1">
                </div>
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="updateUsername" placeholder="new_username">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="updateEmail" placeholder="new@example.com">
                </div>
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="updateFullName" placeholder="New Name">
                </div>
                <button onclick="updateUser()">Update User</button>
                <div class="result-box" id="updateResult"></div>
            </div>
        </div>

        <!-- Delete Tab -->
        <div id="delete" class="tab-content">
            <div class="form-card">
                <h3>Delete User</h3>
                <div class="form-group">
                    <label>User ID</label>
                    <input type="number" id="deleteUserId" placeholder="1" value="1">
                </div>
                <button class="secondary" onclick="deleteUser()" style="background: #f44336;">Delete User</button>
                <div class="result-box" id="deleteResult"></div>
            </div>
        </div>
    </div>

    <script>
        function switchTab(e, tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            e.target.classList.add('active');
        }

        async function apiCall(method, endpoint, data = null) {
            try {
                const options = { method, headers: { 'Content-Type': 'application/json' } };
                if (data) options.body = JSON.stringify(data);
                const response = await fetch('/api' + endpoint, options);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return await response.json().catch(() => response.text());
            } catch (e) {
                throw e;
            }
        }

        function showResult(elementId, data, isError = false) {
            const el = document.getElementById(elementId);
            if (el) {
                el.className = 'result-box' + (isError ? ' error' : ' success');
                if (Array.isArray(data)) {
                    el.innerHTML = data.map(u => 
                        `<div class="list-item">ID: ${u.id} | ${u.username} (${u.email})</div>`
                    ).join('');
                } else if (typeof data === 'object') {
                    el.textContent = JSON.stringify(data, null, 2);
                } else {
                    el.textContent = data;
                }
            }
        }

        async function listAllUsers() {
            try {
                const result = await apiCall('GET', '/users');
                showResult('listResult', result || []);
            } catch (e) {
                showResult('listResult', `Error: ${e.message}`, true);
            }
        }

        async function createUser() {
            try {
                const user = {
                    username: document.getElementById('createUsername').value,
                    email: document.getElementById('createEmail').value,
                    password: document.getElementById('createPassword').value,
                    fullName: document.getElementById('createFullName').value
                };
                if (!user.username || !user.email || !user.password) throw new Error('All fields required');
                const result = await apiCall('POST', '/users', user);
                showResult('createResult', result);
                setTimeout(() => listAllUsers(), 1000);
            } catch (e) {
                showResult('createResult', `Error: ${e.message}`, true);
            }
        }

        async function getUser() {
            try {
                const id = document.getElementById('getUserId').value;
                const result = await apiCall('GET', `/users/${id}`);
                showResult('getResult', result || {});
            } catch (e) {
                showResult('getResult', `Error: ${e.message}`, true);
            }
        }

        async function updateUser() {
            try {
                const id = document.getElementById('updateUserId').value;
                const user = {
                    id: id,
                    username: document.getElementById('updateUsername').value,
                    email: document.getElementById('updateEmail').value,
                    fullName: document.getElementById('updateFullName').value
                };
                const result = await apiCall('PUT', `/users/${id}`, user);
                showResult('updateResult', result || 'User updated successfully');
            } catch (e) {
                showResult('updateResult', `Error: ${e.message}`, true);
            }
        }

        async function deleteUser() {
            try {
                const id = document.getElementById('deleteUserId').value;
                if (!confirm(`Are you sure you want to delete user ${id}?`)) return;
                const result = await apiCall('DELETE', `/users/${id}`);
                showResult('deleteResult', 'User deleted successfully');
            } catch (e) {
                showResult('deleteResult', `Error: ${e.message}`, true);
            }
        }
    </script>
</body>
</html>
